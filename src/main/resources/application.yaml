spring:
  application:
    name: JobApplicationTracker
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop    
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-minimum-32-characters-long-padding}
openai:
  api-key: ${OPENAI_API_KEY:placeholder}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method